<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - wc blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            padding: 2.8rem 2.5rem;
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 0.4rem;
        }
        .logo span { color: #1e40af; }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 50px;
            border: 1px solid #dadce0;
            background: #fff;
            color: #3c4043;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-google:hover {
            background: #f8f9fa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            color: #3c4043;
        }
        .google-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">
        <a href="/articles" class="text-decoration-none">
            <span>wc</span> blog
        </a>
    </div>

    <h4 class="fw-bold mt-3 mb-2">로그인</h4>
    <p class="text-muted mb-4">Google 계정으로 간편하게 시작하세요</p>

    <div th:if="${param.error}" class="alert alert-danger py-2 small">
        로그인에 실패했습니다. 다시 시도해주세요.
    </div>

    <a th:href="@{/oauth2/authorization/google}" class="btn-google">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google로 로그인
    </a>
</div>

</body>
</html>
