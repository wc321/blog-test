<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - wc blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            padding: 2.8rem 2.5rem;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #2563eb;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .logo span { color: #1e40af; }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .btn-signup {
            padding: 0.75rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="logo mb-4">
        <a href="/" class="text-decoration-none">
            <span>wc</span> blog
        </a>
    </div>

    <h4 class="text-center mb-4 fw-bold">회원가입</h4>

    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

    <form th:action="@{/user}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="email@example.com"
                   required autofocus>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="비밀번호를 입력하세요"
                   required>
        </div>

        <button type="submit" class="btn btn-primary btn-signup w-100 mb-3">
            회원가입
        </button>
    </form>

    <div class="text-center">
        <a th:href="@{/login}" class="text-decoration-none text-muted small">
            이미 계정이 있으신가요? 로그인
        </a>
    </div>
</div>

</body>
</html>
